<!DOCTYPE html>
<html>
<head>
	<meta content="text/html;charset=utf-8" http-equiv="Content-Type">
	<meta content="utf-8" http-equiv="encoding">
	<link type="text/css" rel="stylesheet" href="style.css"/>
	<link type="text/css" rel="stylesheet" href="css/triangles.css"/>
	<script type="text/javascript" src="js/triangles.js"></script>
	<title>Mouse sensitive triangles</title>
</head>
<body>
	<div id="wrapper">
		<canvas id="myCanvas" width="498px" height="476px">
			Your browser does not support the HTML5 canvas tag.
		</canvas>
		
		<div class="controls">
			<form id="controls-form" autocomplete="off">
				<input id="drawGrid" type="checkbox" name="toggleGrid" value="on" checked>Draw grid
				<input id="drawOutline" type="checkbox" name="toggleOutline" value="off">Draw outline
				<input id="squeeze" type="checkbox" name="squeezeToggle" value="off">Squeeze together</form>
			</form>
		</div>
	</div>
</body>
</html>
